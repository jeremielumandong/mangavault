# Deploy-specific values (domain, D1 database id) are NOT kept here: they
# come from the gitignored ../config.env via scripts/deploy.sh.
name = "mangavault"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[build]
command = "bash scripts/build.sh"

[[d1_databases]]
binding = "DB"
database_name = "mangavault"
database_id = "00000000-0000-0000-0000-000000000000" # replaced at deploy
migrations_dir = "migrations"

[triggers]
# Must match crawl::LATEST_CRON / crawl::POPULAR_CRON.
crons = ["*/15 * * * *", "7,22,37,52 * * * *"]

[vars]
# Comma-separated accepted token audiences: your iOS bundle id for Apple; your
# Web and iOS OAuth client ids for Google. Set them as build variables instead
# (scripts/deploy.sh passes them on); these empty defaults are for local dev.
APPLE_AUDIENCES = ""
GOOGLE_AUDIENCES = ""
# Series refreshed per cron run and popular pages per site per backfill.
# Lower both on the Workers Free plan (50 subrequests / D1 queries per run).
CRAWL_REFRESH_BUDGET = "15"
CRAWL_POPULAR_PAGES = "1"
DEV_AUTH = "false"
# "open" turns off sign-in: every app uses one shared owner account. Only for a
# personal deployment; set it as a build variable (scripts/deploy.sh passes it on).
AUTH_MODE = ""

[observability]
enabled = true
