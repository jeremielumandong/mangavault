[package]
name = "mangavault-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "wasmbind", "serde"] }
console_error_panic_hook = "0.1.7"
futures = "0.3.34"
getrandom = { version = "0.2", features = ["js"] }
mangavault-core = { version = "0.1.0", path = "../core" }
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.10", features = ["oid"] }
worker = { version = "0.8", features = ["d1"] }

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
rand = "0.8"
rsa = "0.9.10"
