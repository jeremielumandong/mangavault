# XcodeGen spec. Run `xcodegen generate` in apps/ios to create Mangavault.xcodeproj
# (gitignored). See README.md.
name: Mangavault
options:
  bundleIdPrefix: dev.mangavault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MangavaultKit:
    path: Packages/MangavaultKit
targets:
  Mangavault:
    type: application
    platform: iOS
    sources:
      - path: Mangavault
        excludes:
          - Info.plist
    dependencies:
      - package: MangavaultKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MV_BUNDLE_ID)
        PRODUCT_NAME: Mangavault
        INFOPLIST_FILE: Mangavault/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Mangavault/Mangavault.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  MangavaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MangavaultTests
    dependencies:
      - target: Mangavault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(MV_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mangavault.app/Mangavault
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Mangavault:
    build:
      targets:
        Mangavault: all
        MangavaultTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MangavaultTests
    run:
      config: Debug
    archive:
      config: Release
